<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TeleClone</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0e1621;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(82, 136, 193, 0.25);
      border-top-color: #5288c1;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 14px; color: #8b9bb4; margin-bottom: 22px; max-width: 280px; }
    button {
      background: #5288c1;
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Waiting for network...</h2>
  <p>Please check your internet connection. TeleClone will open automatically once reconnected.</p>
  <button onclick="reconnect()">Retry Now</button>

  <script>
    const LIVE_URL = "https://teleclone-production.up.railway.app";
    function reconnect() {
      window.location.replace(LIVE_URL);
    }
    window.addEventListener("online", reconnect);
    setInterval(() => {
      if (navigator.onLine) reconnect();
    }, 4000);
  </script>
</body>
</html>
