name: Build TeleClone Android APK

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Prepare Offline Error Page & Install Capacitor
        working-directory: mobile-app
        run: |
          cp www/index.html www/error.html
          npm install
          npx cap add android
          npx cap sync android

      - name: Add Android Permissions (Phone Number, Contacts, Media, Mic, Camera, Notifications)
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          p = Path("mobile-app/android/app/src/main/AndroidManifest.xml")
          txt = p.read_text(encoding="utf-8")
          perms = """
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.READ_PHONE_NUMBERS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
          """
          if "MODIFY_AUDIO_SETTINGS" not in txt:
              txt = txt.replace("<application", perms + "\n    <application", 1)
          p.write_text(txt, encoding="utf-8")
          EOF

      - name: Prompt Runtime Permissions & Enable WebView Mic/Camera Capture
        run: |
          cat <<'EOF' > mobile-app/android/app/src/main/java/com/teleclone/app/MainActivity.java
          package com.teleclone.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              private static final int PERMISSION_REQUEST_CODE = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestAppPermissions();
                  enableWebViewMediaPermissions();
              }

              private void enableWebViewMediaPermissions() {
                  if (this.bridge == null || this.bridge.getWebView() == null) return;
                  this.bridge.getWebView().setWebChromeClient(new BridgeWebChromeClient(this.bridge) {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          List<String> granted = new ArrayList<>();
                          for (String res : request.getResources()) {
                              if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(res) &&
                                  ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                                  granted.add(res);
                              } else if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(res) &&
                                  ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                                  granted.add(res);
                              }
                          }
                          if (!granted.isEmpty()) {
                              runOnUiThread(() -> request.grant(granted.toArray(new String[0])));
                          } else {
                              super.onPermissionRequest(request);
                          }
                      }
                  });
              }

              private void requestAppPermissions() {
                  List<String> perms = new ArrayList<>();
                  perms.add(Manifest.permission.READ_PHONE_STATE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      perms.add("android.permission.READ_PHONE_NUMBERS");
                  }
                  perms.add(Manifest.permission.READ_CONTACTS);
                  perms.add(Manifest.permission.CAMERA);
                  perms.add(Manifest.permission.RECORD_AUDIO);

                  if (Build.VERSION.SDK_INT >= 33) {
                      perms.add("android.permission.POST_NOTIFICATIONS");
                      perms.add("android.permission.READ_MEDIA_IMAGES");
                      perms.add("android.permission.READ_MEDIA_VIDEO");
                  } else {
                      perms.add(Manifest.permission.READ_EXTERNAL_STORAGE);
                      if (Build.VERSION.SDK_INT <= 29) {
                          perms.add(Manifest.permission.WRITE_EXTERNAL_STORAGE);
                      }
                  }

                  List<String> needed = new ArrayList<>();
                  for (String perm : perms) {
                      if (ContextCompat.checkSelfPermission(this, perm) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(perm);
                      }
                  }

                  if (!needed.isEmpty()) {
                      ActivityCompat.requestPermissions(
                          this,
                          needed.toArray(new String[0]),
                          PERMISSION_REQUEST_CODE
                      );
                  }
              }
          }
          EOF

      - name: Apply Custom App Logo & Splash Screen
        run: |
          if [ ! -f "logo.png" ]; then
            echo "logo.png not found, skipping custom icon."
            exit 0
          fi
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages --quiet pillow || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil)
          python3 - <<'EOF'
          from pathlib import Path
          from PIL import Image, ImageDraw

          res_dir = Path("mobile-app/android/app/src/main/res")
          src = Image.open("logo.png").convert("RGBA")

          # Square center-crop
          side = min(src.width, src.height)
          left = (src.width - side) // 2
          top = (src.height - side) // 2
          src = src.crop((left, top, left + side, top + side))

          # Logo ke outer white corners (agar hon) clean rounded mask se transparent karein
          c_r, c_g, c_b, c_a = src.getpixel((4, 4))
          if c_a > 200 and c_r > 235 and c_g > 235 and c_b > 235:
              rmask = Image.new("L", (side, side), 0)
              ImageDraw.Draw(rmask).rounded_rectangle(
                  (0, 0, side - 1, side - 1), radius=int(side * 0.22), fill=255
              )
              cleaned = Image.new("RGBA", (side, side), (0, 0, 0, 0))
              cleaned.paste(src, (0, 0), rmask)
              src = cleaned

          # Icon theme color sample karein (top-center se taake white corner na aaye)
          tr, tg, tb, ta = src.getpixel((side // 2, max(8, int(side * 0.08))))
          theme_rgb = (tr, tg, tb) if ta > 200 else (99, 68, 245)
          theme_hex = f"#{theme_rgb[0]:02x}{theme_rgb[1]:02x}{theme_rgb[2]:02x}"

          def make_filled_square(img, size):
              bg = Image.new("RGBA", (size, size), (*theme_rgb, 255))
              fg = img.resize((size, size), Image.LANCZOS)
              bg.paste(fg, (0, 0), fg)
              return bg

          def make_circle(img, size):
              sq = make_filled_square(img, size)
              mask = Image.new("L", (size, size), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, size - 1, size - 1), fill=255)
              out = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              out.paste(sq, (0, 0), mask)
              return out

          def make_adaptive_fg(img, size):
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              inner = int(size * 0.72)
              resized = img.resize((inner, inner), Image.LANCZOS)
              offset = (size - inner) // 2
              canvas.paste(resized, (offset, offset), resized)
              return canvas

          mipmap_sizes = {
              "mipmap-mdpi": (48, 108),
              "mipmap-hdpi": (72, 162),
              "mipmap-xhdpi": (96, 216),
              "mipmap-xxhdpi": (144, 324),
              "mipmap-xxxhdpi": (192, 432),
          }

          for folder, (icon_sz, fg_sz) in mipmap_sizes.items():
              d = res_dir / folder
              d.mkdir(parents=True, exist_ok=True)
              make_filled_square(src, icon_sz).save(d / "ic_launcher.png")
              make_circle(src, icon_sz).save(d / "ic_launcher_round.png")
              make_adaptive_fg(src, fg_sz).save(d / "ic_launcher_foreground.png")

          bg_xml = res_dir / "values" / "ic_launcher_background.xml"
          bg_xml.parent.mkdir(parents=True, exist_ok=True)
          bg_xml.write_text(
              f'<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">{theme_hex}</color>\n</resources>\n',
              encoding="utf-8",
          )

          # Dark theme (#16171f) splash screen ke beech centered logo
          for sp in res_dir.rglob("splash.png"):
              with Image.open(sp) as old_sp:
                  w, h = old_sp.size
              canvas = Image.new("RGBA", (w, h), (22, 23, 31, 255))
              logo_sz = int(min(w, h) * 0.32)
              centered = src.resize((logo_sz, logo_sz), Image.LANCZOS)
              canvas.paste(centered, ((w - logo_sz) // 2, (h - logo_sz) // 2), centered)
              canvas.convert("RGB").save(sp)

          print("Custom Android icons & splash screens generated successfully.")
          EOF

      - name: Build Universal Release APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK (V1 + V2 + V3 for Android 6 to 15)
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED="mobile-app/android/app/build/outputs/apk/release/app-release-unsigned.apk"

          keytool -genkey -v \
            -keystore teleclone-release.keystore \
            -alias teleclone \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass teleclone123 \
            -keypass teleclone123 \
            -dname "CN=TeleClone, OU=App, O=TeleClone, L=Sahiwal, S=Punjab, C=PK"

          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED" teleclone-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks teleclone-release.keystore \
            --ks-key-alias teleclone \
            --ks-pass pass:teleclone123 \
            --key-pass pass:teleclone123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out TeleClone-Universal.apk \
            teleclone-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose TeleClone-Universal.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: TeleClone-Android-APK
          path: |
            TeleClone-Universal.apk
            teleclone-release.keystore